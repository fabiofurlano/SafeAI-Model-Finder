[package]
name = "safeai-model-finder"
version.workspace = true
edition = "2024"
authors = ["SafeAI"]
description = "SafeAI Model Finder — local browser app for hardware-aware Ollama model recommendations"
license = "MIT"
repository = "https://github.com/fabiofurlano/SafeAI-Model-Finder"
# Upstream relationship:
# SafeAI Model Finder is derived from llmfit (https://github.com/AlexsJones/llmfit),
# pinned at upstream tag v1.1.8 and rebased onto a SafeAI-owned product
# binary. The upstream MIT licence is preserved verbatim as LICENSE at the
# repository root. See README "Acknowledgements" for details.

[[bin]]
name = "safeai-model-finder"
path = "src/main.rs"

[dependencies]
llmfit-core = { path = "../llmfit-core" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
open = "5"
ureq = { version = "3.2", features = ["json"] }

[build-dependencies]
walkdir = "2"
